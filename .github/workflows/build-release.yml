name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.0.1-beta, etc.
  workflow_dispatch: # Allow manual trigger for testing

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev libfuse2 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux tarball
        run: |
          cd build/linux/x64/release
          # Rename 'bundle' to a more descriptive folder name
          mv bundle dune-awakening-companion
          tar -czvf dune-awakening-companion-${{ github.ref_name }}-linux-x64.tar.gz dune-awakening-companion/

      - name: Build AppImage
        run: |
          # Download appimagetool
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # Assemble AppDir — keep the Flutter bundle intact so the
          # executable can find lib/ and data/ via its built-in rpath.
          cd build/linux/x64/release
          rm -rf AppDir
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy the entire Flutter bundle as-is
          cp -r dune-awakening-companion AppDir/app

          # Icon
          cp ../../../../assets/app_icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/dune_awakening_companion.png
          cp ../../../../assets/app_icon.png AppDir/dune_awakening_companion.png

          # .desktop file (must not have leading whitespace)
          cat > AppDir/dune_awakening_companion.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dune Awakening Companion
          Icon=dune_awakening_companion
          Exec=dune_awakening_companion
          Categories=Utility;
          EOF
          sed -i 's/^          //' AppDir/dune_awakening_companion.desktop

          # AppRun — launch the executable from the intact bundle
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/app/dune_awakening_companion" "$@"
          EOF
          sed -i 's/^          //' AppDir/AppRun
          chmod +x AppDir/AppRun

          cd "$GITHUB_WORKSPACE"

          # Build the AppImage
          ARCH=x86_64 ./appimagetool build/linux/x64/release/AppDir \
            "build/linux/x64/release/dune-awakening-companion-${{ github.ref_name }}-linux-x64.AppImage"

          # Verify
          if [[ ! -f "build/linux/x64/release/dune-awakening-companion-${{ github.ref_name }}-linux-x64.AppImage" ]]; then
            echo "Error: AppImage was not created."
            exit 1
          fi
          echo "AppImage built successfully."

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/linux/x64/release/*.tar.gz
            build/linux/x64/release/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle VC++ Redistributable and README
        run: |
          cd build/windows/x64/runner/Release
          
          # Download VC++ Redistributable
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "install_visual_c++_redist.exe"
          
          # Create README.txt
          Set-Content -Path "README.txt" -Value "Dune Awakening Companion`r`n---------------------------`r`n`r`nIf the app fails to launch with 'MSVCP140.dll was not found',`r`nplease run 'install_visual_c++_redist.exe' included in this folder.`r`n`r`nThis is a standard Microsoft runtime required for Windows apps."

      - name: Create Windows zip
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath dune-awakening-companion-${{ github.ref_name }}-windows-x64.zip
          
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/*.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r dune-awakening-companion-${{ github.ref_name }}-macos.zip "dune_awakening_companion.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/dune-awakening-companion-${{ github.ref_name }}-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/*.apk

  release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' -o -name '*.AppImage' \) \
            -exec sha256sum {} \; | sort > ../checksums.txt
          cat ../checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "🏜️ ${{ github.ref_name }}"
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            artifacts/linux-build/*.tar.gz
            artifacts/linux-build/*.AppImage
            artifacts/windows-build/*.zip
            artifacts/macos-build/*.zip
            artifacts/android-build/*.apk
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
