version: 1

AppDir:
  path: ${APPDIR_PATH}
  app_info:
    id: com.startuz.dune_awakening_companion
    name: Dune Awakening Companion
    icon: dune_awakening_companion
    version: ${APP_VERSION}
    exec: dune_awakening_companion
  apt:
    arch: amd64
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main universe'
    include:
      - libayatana-appindicator3-1
      - libgtk-3-0
      - liblzma5
      - libstdc++6
      - libgcc-s1
      - libsqlite3-0
      - libglib2.0-0

AppImage:
  arch: x86_64
